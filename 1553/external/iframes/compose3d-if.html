<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, maximum-scale=1">
  <title>Composition of Transformations</title>
  <!-- Shared MathJax config + helpers. Plain script: no defer/async. -->
  <script src="js/mathjax-setup.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: white; overflow: hidden;
      display: flex; flex-direction: column;
    }
    /* Caption / control bar above the canvas; scrolls if controls get tall */
    .caption-bar {
      flex: 0 0 auto; max-height: 55%; overflow-y: auto;
      padding: 5px 10px; background: white; border-bottom: 1px solid #ccc;
    }
    .caption-bar p      { margin: 2px 0; font-size: 0.9em; }
    .caption-bar p.hint { font-size: 0.8em; color: #555; }
    .live-math { display: inline-block; min-height: 1.4em; }
    details.panel { margin-top: 3px; font-size: 0.82em; }
    details.panel summary { cursor: pointer; color: #444; user-select: none; }
    .ctrl-row { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; margin-top: 3px; font-size: 0.88em; }
    .check-row { display: inline-flex; align-items: center; gap: 4px; }
    .vec-grid { display: flex; flex-wrap: wrap; gap: 2px 16px; margin-top: 3px; }
    .vec-row   { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
    .vec-label { min-width: 1.6em; text-align: right; }
    .vec-row input[type="number"] {
      width: 58px; padding: 1px 3px; font-size: 0.95em;
      border: 1px solid #767676; border-radius: 2px;
    }
    .slider-grid {
      display: grid; grid-template-columns: auto 1fr 3.5em;
      gap: 2px 6px; align-items: center; margin-top: 4px; font-size: 0.88em;
    }
    .slider-grid label { text-align: right; white-space: nowrap; }
    .slider-grid input[type="range"] { width: 100%; }
    .slider-val { text-align: right; font-variant-numeric: tabular-nums; }
    button.ctl {
      font: inherit; padding: 2px 8px; cursor: pointer;
      border: 1px solid #767676; border-radius: 3px; background: #f4f4f4;
    }
    button.ctl:hover { background: #e6e6e6; }
    .status { margin-top: 3px; padding: 3px 8px; border: 1px solid #444; border-radius: 3px; font-size: 0.9em; }
    /* Canvas area: one or more equal panels side by side */
    #mathbox-container { flex: 1 1 auto; position: relative; overflow: hidden; display: flex; }
    .mb-panel { flex: 1 1 0; position: relative; min-width: 0; }
    .mb-panel + .mb-panel { border-left: 1px solid #ccc; }
    .mb-panel > div { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .mathbox-label {
      position: absolute; left: 50%; top: 6px; transform: translate(-50%, 0); z-index: 2;
      color: black; background: rgba(235, 235, 235, .85); border: 1px solid rgba(50, 50, 50, .5);
      padding: 2px 6px; font-size: 0.85em; pointer-events: none; white-space: nowrap;
    }
    /* MathJax labels over the canvas (js/demo-labels.js) */
    .label-layer  { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                    pointer-events: none; overflow: hidden; z-index: 1; }
    .canvas-label { position: absolute; left: 0; top: 0; font-size: 15px; white-space: nowrap;
                    text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 2px #fff; will-change: transform; }
    :focus-visible { outline: 2px solid #0066cc; outline-offset: 2px; }
    #fs-btn {
      float: right; cursor: pointer; background: none;
      border: 1px solid #767676; border-radius: 3px;
      padding: 2px 6px; font-size: 0.85em; color: #444;
    }
    #fs-btn:hover { background: rgba(0,0,0,.07); }
    :fullscreen #fs-btn, :-webkit-full-screen #fs-btn { display: none; }
  </style>
</head>
<body>

  <div class="caption-bar" role="region" aria-label="Composition of transformations controls">
    <button id="fs-btn" title="Toggle fullscreen" aria-label="Toggle fullscreen">⛶</button>
    <p><span id="matrix1-here" class="live-math" aria-live="polite" aria-atomic="true"></span></p>
    <p><span id="matrix2-here" class="live-math" aria-live="polite" aria-atomic="true"></span></p>
    <p><span id="matrix3-here" class="live-math" aria-live="polite" aria-atomic="true"></span></p>
    <p class="hint mathjax-static">Drag \(x\) in the left panel, or edit its coordinates below.</p>
    <details class="panel">
      <summary>Options and coordinates</summary>
      <div id="check-panel" class="ctrl-row"></div>
      <div id="vec-inputs" class="vec-grid" role="group" aria-label="Coordinates of x"></div>
    </details>
  </div>

  <!-- Canvas: draggable for pointer users; aria-hidden because the caption bar
       and controls expose the same state to assistive technology -->
  <div id="mathbox-container" aria-hidden="true">
    <div class="mb-panel"><div id="mathbox1">
        <div class="mathbox-label mathjax-static">Input of \(U\)</div>
      </div></div>
    <div class="mb-panel"><div id="mathbox2">
        <div class="mathbox-label mathjax-static">Output of \(U\) / input of \(T\)</div>
      </div></div>
    <div class="mb-panel"><div id="mathbox3">
        <div class="mathbox-label mathjax-static">Output of \(T\) / of \(T\circ U\)</div>
      </div></div>
  </div>

  <!-- Shared scripts in external/iframes/js/. Plain scripts, this order. -->
  <script src="js/demo.js"></script>
  <script src="js/demo-theme.js"></script>   <!-- book colour palette; must follow demo.js -->
  <script src="js/demo-labels.js"></script>  <!-- MathJax canvas labels -->
  <script src="js/demo-ui.js"></script>      <!-- TeX builders + native controls -->
  <script>
  "use strict";

  DomReady.ready(function() {
    var vector1 = urlParams.get('x', 'float[]', [-1, 2, 3]);
    var vector2 = [0, 0, 0];
    var vector3 = [0, 0, 0];
    var color1 = new Color("green");
    var color2 = new Color("violet");
    var color3 = new Color("red");
    var matrix1 = urlParams.get('mat1', 'matrix', [[1, 0, 0], [0, 1, 0], [0, 0, 1]]);
    var matrix2 = urlParams.get('mat2', 'matrix', [[1, 0, 0], [0, 1, 0], [0, 0, 1]]);
    var dim1 = matrix1[0].length;
    var dim2 = matrix2[0].length;
    var dim3 = matrix2.length;
    if (dim1 === 2) vector1[2] = 0;
    function transpose(mat) {
      var tmp = [], i, j, r;
      for (i = 0; i < 3; i++) {
        tmp[i] = [];
        for (j = 0; j < 3; j++) {
          r = mat[j] != null ? mat[j][i] : void 0;
          tmp[i][j] = r != null ? r : 0;
        }
      }
      return tmp;
    }
    matrix1 = transpose(matrix1);
    matrix2 = transpose(matrix2);
    // Columns of matrix2 * matrix1
    var matrix3 = matrix1.map(function(col) {
      return [0, 1, 2].map(function(r) {
        return matrix2[0][r] * col[0] + matrix2[1][r] * col[1] + matrix2[2][r] * col[2];
      });
    });
    var tMatrix1 = new THREE.Matrix3();
    tMatrix1.set(matrix1[0][0], matrix1[1][0], matrix1[2][0], matrix1[0][1], matrix1[1][1], matrix1[2][1], matrix1[0][2], matrix1[1][2], matrix1[2][2]);
    var tMatrix2 = new THREE.Matrix3();
    tMatrix2.set(matrix2[0][0], matrix2[1][0], matrix2[2][0], matrix2[0][1], matrix2[1][1], matrix2[2][1], matrix2[0][2], matrix2[1][2], matrix2[2][2]);

    var params = {
      Axes:       urlParams.get('axes',    'bool', true),
      'range U':  urlParams.get('rangeU',  'bool', true),
      'range T':  urlParams.get('rangeT',  'bool', true),
      'range TU': urlParams.get('rangeTU', 'bool', true)
    };
    var editor = null, updateCaption, demos;
    var tmpVec = new THREE.Vector3();
    function computeOut() {
      tmpVec.set.apply(tmpVec, vector1).applyMatrix3(tMatrix1);
      vector2[0] = tmpVec.x; vector2[1] = tmpVec.y; vector2[2] = tmpVec.z;
      tmpVec.applyMatrix3(tMatrix2);
      vector3[0] = tmpVec.x; vector3[1] = tmpVec.y; vector3[2] = tmpVec.z;
      if (editor) editor.sync();
      updateCaption();
    }
    if (urlParams.range != null) {
      urlParams.range1 = urlParams.range2 = urlParams.range3 = urlParams.range;
    }

    function setupDemo(opts) {
      return new (opts.dim === 3 ? Demo : Demo2D)({
        fullscreen: false,
        mathbox: mbOpts('mathbox' + opts.index),
        scaleUI: false
      }, function() {
        var r;
        this.index = opts.index;
        this.vector = opts.vector;
        this.dim = opts.dim;
        this.color = opts.color;
        window['mathbox' + this.index] = this.mathbox;
        this.range = r = urlParams.get('range' + this.index, 'float', 10.0);
        this.viewObj = this.view({
          name: 'view' + this.index,
          viewRange: [[-r, r], [-r, r], [-r, r]].slice(0, this.dim),
          axisLabels: false
        });
        this.mathbox.select('.view' + this.index + '-axes').set('visible', params.Axes);
        // No `labels` option: WebGL text replaced by MathJax labels below
        this.labeledVectors(this.viewObj, {
          name: 'labeled' + this.index,
          vectors: [this.vector],
          colors: [this.color],
          live: true,
          zeroPoints: true,
          zeroThreshold: 0.1,
          vectorOpts: { zIndex: 2 },
          zeroOpts: { zIndex: 3 }
        });
        var layer = makeLabelLayer(document.getElementById('mathbox' + this.index), this, this.viewObj);
        addVectorLabels(layer, [opts.vector], [opts.color], [opts.labelTex]);
        this.clipCubeObj = this.clipCube(this.viewObj, {
          draw: this.dim === 3,
          hilite: this.dim === 3,
          material: new THREE.MeshBasicMaterial({
            color: new THREE.Color(0, 0, 0), opacity: 0.5, transparent: true,
            visible: false, depthWrite: false, depthTest: true
          })
        });
      });
    }

    window.demo1 = setupDemo({ index: 1, vector: vector1, dim: dim1, color: color1, labelTex: 'x' });
    window.demo2 = setupDemo({ index: 2, vector: vector2, dim: dim2, color: color2, labelTex: 'U(x)' });
    window.demo3 = setupDemo({ index: 3, vector: vector3, dim: dim3, color: color3, labelTex: 'T(U(x))' });
    demos = [demo1, demo2, demo3];
    groupControls(demo1, demo2, demo3);
    demo1.draggable(demo1.viewObj, { points: [vector1], postDrag: computeOut });

    var dark1 = color1.darken(.1);
    demo2.rangeU = demo2.subspace({
      name: 'rangeU', vectors: matrix1, live: false, color: dark1, mesh: demo2.clipCubeObj.mesh
    });
    if (demo2.rangeU.dim === 3) {
      demo2.clipCubeObj.installMesh();
      demo2.clipCubeObj.mesh.material.color.copy(dark1);
    }
    demo2.rangeU.draw(demo2.clipCubeObj.clipped);
    demo2.rangeU.setVisibility(params['range U']);
    var dark2 = color2.darken(.1);
    demo3.rangeT = demo3.subspace({
      name: 'rangeT', vectors: matrix2, live: false, color: dark2, mesh: demo3.clipCubeObj.mesh
    });
    demo3.rangeT.draw(demo3.clipCubeObj.clipped);
    demo3.rangeT.setVisibility(params['range T']);
    var dark3 = color1.darken(.1);
    demo3.rangeTU = demo3.subspace({
      name: 'rangeTU', vectors: matrix3, live: false, color: dark3, mesh: demo3.clipCubeObj.mesh
    });
    demo3.rangeTU.draw(demo3.clipCubeObj.clipped);
    demo3.rangeTU.setVisibility(params['range TU']);
    if (demo3.rangeT.dim === 3 || demo3.rangeTU.dim === 3) demo3.clipCubeObj.installMesh();

    // ── Display options (replace dat.GUI) ───────────────────────────────────
    var checks = document.getElementById('check-panel');
    addCheckbox(checks, { id: 'axes', label: 'Show axes', checked: params.Axes, onChange: function(v) {
      for (var i = 0; i < 3; i++) demos[i].mathbox.select('.view' + (i + 1) + '-axes').set('visible', v);
    }});
    addCheckbox(checks, { id: 'rangeU', label: 'Show range of \\(U\\)', checked: params['range U'],
      onChange: function(v) { demo2.rangeU.setVisibility(v); } });
    addCheckbox(checks, { id: 'rangeT', label: 'Show range of \\(T\\)', checked: params['range T'],
      onChange: function(v) {
        if (v && demo3.rangeT.dim === 3) demo3.clipCubeObj.mesh.material.color.copy(dark2);
        demo3.rangeT.setVisibility(v);
      } });
    addCheckbox(checks, { id: 'rangeTU', label: 'Show range of \\(T\\circ U\\)', checked: params['range TU'],
      onChange: function(v) {
        if (v && demo3.rangeTU.dim === 3) demo3.clipCubeObj.mesh.material.color.copy(dark3);
        demo3.rangeTU.setVisibility(v);
      } });

    // ── Captions ────────────────────────────────────────────────────────────
    var matrix1Elt = document.getElementById('matrix1-here');
    var matrix2Elt = document.getElementById('matrix2-here');
    var matrix3Elt = document.getElementById('matrix3-here');
    updateCaption = function() {
      renderMath('U(' + texC(color1, 'x') + ') = ' + texMat(matrix1, { cols: dim1, rows: dim2 }) +
                 texVec(vector1, color1, dim1) + '=' + texVec(vector2, color2, dim2), matrix1Elt);
      renderMath('T(' + texC(color2, 'U(x)') + ') = ' + texMat(matrix2, { cols: dim2, rows: dim3 }) +
                 texVec(vector2, color2, dim2) + '=' + texVec(vector3, color3, dim3), matrix2Elt);
      renderMath('T\\circ U(' + texC(color1, 'x') + ') = ' + texMat(matrix3, { cols: dim1, rows: dim3 }) +
                 texVec(vector1, color1, dim1) + '=' + texVec(vector3, color3, dim3), matrix3Elt);
    };

    editor = buildVectorEditor(document.getElementById('vec-inputs'),
      [{ name: 'x', tex: 'x', vec: vector1, dim: dim1 }], demo1.range, computeOut);
    computeOut();
  }); // end DomReady.ready

  initFullscreenButton('fs-btn');
  </script>
</body>
</html>
