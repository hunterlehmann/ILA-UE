</h2>
<div class="para">Consider a <em class="emphasis">consistent</em> system of equations in the variables <span class="process-math">\(x_1,x_2,\ldots,x_n\text{.}\)</span>  Let <span class="process-math">\(A\)</span> be a row echelon form of the augmented matrix for this system.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#subsec-free-variables-5-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para">We say that <span class="process-math">\(x_i\)</span> is a <dfn class="terminology">free variable</dfn> if its corresponding column in <span class="process-math">\(A\)</span> is <em class="emphasis">not</em> a <a href="sec-row-reduction.html#defn-pivot-pos" class="xref" data-knowl="./knowl/xref/defn-pivot-pos.html" data-reveal-label="Reveal" data-close-label="Close" title="Definition 1.2.15: Pivots">pivot column</a>.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#subsec-free-variables-5-2-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
