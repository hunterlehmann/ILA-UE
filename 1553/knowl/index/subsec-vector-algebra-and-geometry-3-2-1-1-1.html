<div class="para">We can add two vectors together:</div>
<div class="displaymath process-math">
\begin{gather*}
\begin{pmatrix}
a \\
b \\
c
\end{pmatrix} + \begin{pmatrix}
x \\
y \\
z
\end{pmatrix} = \begin{pmatrix}
a+x \\
b+y \\
c+z
\end{pmatrix}\text{.}
\end{gather*}
</div>
