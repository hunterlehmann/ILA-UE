<div class="para logical">
<div class="para">The <dfn class="terminology">distance</dfn> between two points <span class="process-math">\(x,y\)</span> in <span class="process-math">\(\R^n\)</span> is the length of the <a href="sec-vectors.html#vectors-diff-pts" class="xref" data-knowl="./knowl/xref/vectors-diff-pts.html" data-reveal-label="Reveal" data-close-label="Close" title="Note 2.1.5">vector from</a> <span class="process-math">\(x\)</span> to <span class="process-math">\(y\text{:}\)</span>
</div>
<div class="displaymath process-math" data-contains-math-knowls="./knowl/xref/vectors-diff-pts.html">
\begin{gather*}
\dist(x,y) = \|y-x\|\text{.}
\end{gather*}
</div>
