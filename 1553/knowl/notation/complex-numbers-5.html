<div class="para logical">
<ol class="decimal" id="complex-numbers-5-4-1-1">
<li>
<div class="para">The <dfn class="terminology">imaginary number</dfn> <span class="process-math">\(i\)</span> is defined to satisfy the equation <span class="process-math">\(i^2 = -1\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#complex-numbers-5-4-1-1-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="autopermalink" aria-hidden="true" data-description="Item 1"><a tabindex="-1" href="#complex-numbers-5-4-1-1-1" title="Copy heading and permalink for Item 1" aria-label="Copy heading and permalink for Item 1">🔗</a></div>
</li>
<li>
<div class="para">A <dfn class="terminology">complex number</dfn> is a number of the form <span class="process-math">\(a+bi\text{,}\)</span> where <span class="process-math">\(a,b\)</span> are real numbers.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#complex-numbers-5-4-1-1-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="autopermalink" aria-hidden="true" data-description="Item 2"><a tabindex="-1" href="#complex-numbers-5-4-1-1-2" title="Copy heading and permalink for Item 2" aria-label="Copy heading and permalink for Item 2">🔗</a></div>
</li>
</ol>
<div class="para">The set of all complex numbers is denoted <span class="process-math">\(\C\text{.}\)</span>
</div>
