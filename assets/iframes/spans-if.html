<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, maximum-scale=1">
  <title>Span of vectors</title>
  <!-- Shared MathJax config + helpers. Plain script: no defer/async. -->
  <script src="js/mathjax-setup.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: white; overflow: hidden;
      display: flex; flex-direction: column;
    }
    /* Caption / control bar above the canvas; scrolls if controls get tall */
    .caption-bar {
      flex: 0 0 auto; max-height: 55%; overflow-y: auto;
      padding: 5px 10px; background: white; border-bottom: 1px solid #ccc;
    }
    .caption-bar p      { margin: 2px 0; font-size: 0.9em; }
    .caption-bar p.hint { font-size: 0.8em; color: #555; }
    .live-math { display: inline-block; min-height: 1.4em; }
    details.panel { margin-top: 3px; font-size: 0.82em; }
    details.panel summary { cursor: pointer; color: #444; user-select: none; }
    .ctrl-row { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; margin-top: 3px; font-size: 0.88em; }
    .check-row { display: inline-flex; align-items: center; gap: 4px; }
    .vec-grid { display: flex; flex-wrap: wrap; gap: 2px 16px; margin-top: 3px; }
    .vec-row   { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
    .vec-label { min-width: 1.6em; text-align: right; }
    .vec-row input[type="number"] {
      width: 58px; padding: 1px 3px; font-size: 0.95em;
      border: 1px solid #767676; border-radius: 2px;
    }
    .slider-grid {
      display: grid; grid-template-columns: auto 1fr 3.5em;
      gap: 2px 6px; align-items: center; margin-top: 4px; font-size: 0.88em;
    }
    .slider-grid label { text-align: right; white-space: nowrap; }
    .slider-grid input[type="range"] { width: 100%; }
    .slider-val { text-align: right; font-variant-numeric: tabular-nums; }
    button.ctl {
      font: inherit; padding: 2px 8px; cursor: pointer;
      border: 1px solid #767676; border-radius: 3px; background: #f4f4f4;
    }
    button.ctl:hover { background: #e6e6e6; }
    .status { margin-top: 3px; padding: 3px 8px; border: 1px solid #444; border-radius: 3px; font-size: 0.9em; }
    /* Canvas area: one or more equal panels side by side */
    #mathbox-container { flex: 1 1 auto; position: relative; overflow: hidden; display: flex; }
    .mb-panel { flex: 1 1 0; position: relative; min-width: 0; }
    .mb-panel + .mb-panel { border-left: 1px solid #ccc; }
    .mb-panel > div { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .mathbox-label {
      position: absolute; left: 50%; top: 6px; transform: translate(-50%, 0); z-index: 2;
      color: black; background: rgba(235, 235, 235, .85); border: 1px solid rgba(50, 50, 50, .5);
      padding: 2px 6px; font-size: 0.85em; pointer-events: none; white-space: nowrap;
    }
    /* MathJax labels over the canvas (js/demo-labels.js) */
    .label-layer  { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                    pointer-events: none; overflow: hidden; z-index: 1; }
    .canvas-label { position: absolute; left: 0; top: 0; font-size: 15px; white-space: nowrap;
                    text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 2px #fff; will-change: transform; }
    :focus-visible { outline: 2px solid #0066cc; outline-offset: 2px; }
    #fs-btn {
      float: right; cursor: pointer; background: none;
      border: 1px solid #767676; border-radius: 3px;
      padding: 2px 6px; font-size: 0.85em; color: #444;
    }
    #fs-btn:hover { background: rgba(0,0,0,.07); }
    :fullscreen #fs-btn, :-webkit-full-screen #fs-btn { display: none; }
    .span-type   { color: var(--palette-violet); }
    .complement  { color: var(--palette-red); }
    .inter-is    { padding: 0 6px; }
    #success     { border-color: var(--palette-green); }
    #success strong { color: var(--palette-green); }
  </style>
</head>
<body>

  <div class="caption-bar" role="region" aria-label="Span of vectors controls">
    <button id="fs-btn" title="Toggle fullscreen" aria-label="Toggle fullscreen">⛶</button>
    <!-- Caption content depends on the captions= URL mode; built in JS -->
    <div id="caption-main" aria-live="polite" aria-atomic="true"></div>
    <!-- Replaces the demo.js success popup (target mode) -->
    <div id="success" class="status" role="status" hidden>
      <strong>Success</strong> <span id="success-here" class="live-math"></span>
    </div>
    <details id="controls" class="panel" open hidden>
      <summary>Controls</summary>
      <div id="check-panel" class="ctrl-row"></div>
      <div id="slider-panel" class="slider-grid" role="group" aria-label="Coefficients"></div>
    </details>
    <details id="vec-editor" class="panel" hidden>
      <summary>Edit vectors</summary>
      <div id="vec-inputs" class="vec-grid" role="group" aria-label="Vector coordinates"></div>
    </details>
  </div>

  <!-- Canvas: draggable for pointer users; aria-hidden because the caption bar
       and controls expose the same state to assistive technology -->
  <div id="mathbox-container" aria-hidden="true">
    <div class="mb-panel"><div id="mathbox1"></div></div>
  </div>

  <!-- Shared scripts in external/iframes/js/. Plain scripts, this order. -->
  <script src="js/demo.js"></script>
  <script src="js/demo-theme.js"></script>   <!-- book colour palette; must follow demo.js -->
  <script src="js/demo-labels.js"></script>  <!-- MathJax canvas labels -->
  <script src="js/demo-ui.js"></script>      <!-- TeX builders + native controls -->
  <script>
  "use strict";

  DomReady.ready(function() {
    var ref;
    var is2D = ((ref = urlParams.v1) != null ? ref.split(',').length : void 0) === 2;
    var DIM  = is2D ? 2 : 3;

    window.demo = new (is2D ? Demo2D : Demo)({
      fullscreen: false,
      mathbox: mbOpts('mathbox1')
    }, function() {
      var self = this;
      var base, base1, base2, base3, base4, base5, base6, base7, ref1, ref3, ref4;
      var clipCube, complement, linCombo, subspace, updateCaption;
      window.mathbox = this.mathbox;

      // ── URL parameters (unchanged from ILA) ───────────────────────────────
      this.numVecs = 3;
      this.vector1 = this.urlParams.get('v1', 'float[]', [5, 3, -2]);
      this.vector2 = this.urlParams.get('v2', 'float[]', [3, -4, 1]);
      this.vector3 = this.urlParams.get('v3', 'float[]', [-1, 1, 7]);
      this.labels  = this.urlParams.get('labels', 'str[]', ['v1', 'v2', 'v3']);
      this.coeffs  = this.urlParams.get('coeffs', 'str[]', ['x', 'y', 'z']);
      this.lcstart = this.urlParams.get('lcstart', 'float[]', [1.0, 1.0, 1.0]);
      this.colors  = [new Color("blue"), new Color("green"), new Color("brown")];
      this.doTarget     = false;
      this.target       = null;
      this.targetColor  = new Color(0, 0, 0);
      this.doComplement = false;
      this.hideSpace    = false;
      if (this.urlParams.v1 != null) this.numVecs = 1;
      if (this.urlParams.v2 != null) this.numVecs = 2;
      if (this.urlParams.v3 != null) this.numVecs = 3;
      if (this.urlParams.target != null) {
        this.target   = this.urlParams.get('target', 'float[]');
        this.doTarget = true;
        if ((base  = this.urlParams).lincombo == null) base.lincombo  = 'on';
        if ((base1 = this.urlParams).captions == null) base1.captions = 'target';
        if ((base2 = this.urlParams).nomove   == null) base2.nomove   = 'true';
        if ((base3 = this.urlParams).grid     == null) base3.grid     = 'on';
        this.hideSpace = true;
      } else if (this.urlParams.captions === 'combo') {
        if ((base4 = this.urlParams).lincombo == null) base4.lincombo = 'on';
        if ((base5 = this.urlParams).grid     == null) base5.grid     = 'on';
        this.hideSpace = true;
      } else if (this.urlParams.captions === 'orthog') {
        if ((base6 = this.urlParams).lincombo == null) base6.lincombo = 'disabled';
        if ((base7 = this.urlParams).grid     == null) base7.grid     = 'disabled';
        this.doComplement = true;
      }
      this.targetLabel = (ref1 = this.urlParams.tlabel) != null ? ref1 : 'w';
      this.hideSpace   = this.urlParams.get('hidespace', 'bool', this.hideSpace);
      this.vectors = [this.vector1, this.vector2, this.vector3].slice(0, this.numVecs);
      this.colors  = this.colors.slice(0, this.numVecs);
      this.labels  = this.labels.slice(0, this.numVecs);
      this.coeffs  = this.coeffs.slice(0, this.numVecs);
      this.lcstart = this.lcstart.slice(0, this.numVecs);
      this.isLive  = (this.urlParams.nomove == null) || this.urlParams.nomove === "false";
      if (is2D) {
        this.vectors.forEach(function(v) { v[2] = 0; });
        if (this.doTarget) this.target[2] = 0;
      }

      // ── Control state (was dat.GUI) ────────────────────────────────────────
      var params = { Axes: this.urlParams.axes === "on", showCombo: this.urlParams.lincombo === "on" };
      if (this.urlParams.lincombo !== "disabled") {
        this.coeffs.forEach(function(c, i) { params[c] = self.lcstart[i]; });
      }
      var gridEnabled = (ref3 = this.urlParams.grid) === "enabled" || ref3 === "on";
      if (gridEnabled) params.Grid = this.urlParams.grid === "on";
      function coeffVals() { return self.coeffs.map(function(c) { return params[c]; }); }

      // ── Scene ──────────────────────────────────────────────────────────────
      var view = this.view({
        grid: false,
        axes: this.urlParams.axes !== "disabled",
        axisOpts: { zIndex: 1 }
      });
      this.mathbox.select(".view-axes").set("visible", params.Axes);
      if (this.urlParams.captions === 'orthog') {
        view.array({ channels: 3, width: 1, live: false, data: [[0, 0, 0]] })
            .point({ color: "black", size: 15, zIndex: 3 });
      }
      var lVectors = this.vectors.slice();
      var lColors  = this.colors.slice();
      var lLabels  = this.labels.slice();
      if (this.doTarget) {
        lVectors.push(this.target);
        lColors.push(this.targetColor);
        lLabels.push(this.targetLabel);
      }
      var labelColors = lColors.slice();   // labeledVectors overwrites entries with arrays
      // No `labels` option: WebGL text replaced by MathJax labels below
      this.labeledVectors(view, {
        vectors: lVectors, colors: lColors,
        live: this.isLive, zeroPoints: true, zeroThreshold: 0.05,
        vectorOpts: { zIndex: 2 }, zeroOpts: { zIndex: 3 }
      });
      var labelLayer = makeLabelLayer(document.getElementById('mathbox1'), this, view);
      addVectorLabels(labelLayer, lVectors, labelColors, lLabels);

      var comboLabel = null;
      var comboColor = new Color("red");    // demo.js linearCombo default pointColor
      function updateComboLabel() {
        if (!comboLabel) return;
        var s = '';
        coeffVals().forEach(function(c, i) {
          s += (i === 0 ? (c < 0 ? '-' : '') : (c < 0 ? '-' : '+')) +
               fmt(Math.abs(c)) + '\\,' + texLabel(self.labels[i]);
        });
        comboLabel.set(texC(comboColor, s));
      }
      if (this.urlParams.lincombo !== "disabled") {
        linCombo = this.linearCombo(view, {
          coeffs: params, coeffVars: this.coeffs,
          vectors: this.vectors, colors: this.colors.slice()
        });
        this.mathbox.select(".lincombo").set("visible", params.showCombo);
        comboLabel = labelLayer.add({
          position: function() { return linCombo.combine(); },
          visible:  function() { return params.showCombo; }
        });
        updateComboLabel();
      }

      var surfaceColor    = new Color("violet");
      var complementColor = new Color("red");
      clipCube = this.clipCube(view, {
        draw: true,
        material: new THREE.MeshBasicMaterial({
          color: surfaceColor.three(), opacity: 0.25, transparent: true,
          visible: false, depthWrite: false, depthTest: true
        })
      });
      clipCube.installMesh();
      clipCube.uniforms.hilite.value = !params.Grid;
      var range = this.urlParams.get('range', 'float', 10);
      var snapThreshold = 1.0 * range / 10.0;
      var zeroThreshold = 0.00001;
      subspace = this.subspace({
        vectors: this.vectors, noPlane: is2D && this.hideSpace,
        zeroThreshold: zeroThreshold, live: this.isLive, range: range,
        color: surfaceColor, lineOpts: { zOrder: 0 }, surfaceOpts: { zOrder: 1 }
      });
      subspace.draw(clipCube.clipped);
      if (this.doComplement) {
        complement = this.subspace({
          name: 'complement', vectors: subspace.complementFull(is2D),
          noPlane: is2D && this.hideSpace, zeroThreshold: zeroThreshold,
          live: this.isLive, range: range, color: complementColor,
          pointOpts: { size: 20, zIndex: 4 }, lineOpts: { zOrder: 0 }, surfaceOpts: { zOrder: 1 }
        });
        complement.draw(clipCube.clipped);
      }
      if ((ref4 = this.urlParams.grid) === "enabled" || ref4 === "on") {
        this.grid(clipCube.clipped, {
          vectors: this.vectors, live: this.isLive, lineOpts: { color: surfaceColor }
        });
        mathbox.select("#vecgrid").set("visible", this.urlParams.grid === "on");
      }

      // ── Snapping while dragging (unchanged from ILA) ───────────────────────
      var snapped = new THREE.Vector3();
      var diff    = new THREE.Vector3();
      var subspaces = [
        this.subspace({ vectors: [[0, 0, 0]] }),
        this.subspace({ vectors: [[0, 0, 0]] }),
        this.subspace({ vectors: [[0, 0, 0], [0, 0, 0]] }),
        this.subspace({ vectors: [[0, 0, 0], [0, 0, 0], [0, 0, 0]] })
      ];
      function snap(vec, vecs) {
        var ss = subspaces[vecs.length];
        if (vecs.length > 0) ss.setVecs(vecs);
        ss.project(vec, snapped);
        diff.copy(vec).sub(snapped);
        if (diff.lengthSq() <= snapThreshold) { vec.copy(snapped); return true; }
        return false;
      }
      var onDrag = function(vec) {
        var dragging = this.dragging, others = [], i, l;
        if (snap(vec, [])) return;
        for (i = 0; i < self.numVecs; i++) if (i !== dragging) others.push(self.vectors[i]);
        for (l = 0; l < others.length; l++) if (snap(vec, [others[l]])) return;
        return snap(vec, others);
      };
      function updateMesh() {
        var mesh = clipCube.mesh;
        if ((complement != null ? complement.dim : void 0) === 3) {
          mesh.material.color = complementColor;
          mesh.material.visible = true;
        } else if (subspace.dim === 3) {
          mesh.material.color = surfaceColor.three();
          mesh.material.visible = true;
        } else {
          mesh.material.visible = false;
        }
      }
      updateMesh();

      // Shared by drag and keyboard edits
      var editor = null;
      function afterVectorsChanged() {
        subspace.setVecs(self.vectors);
        if (complement != null) complement.setVecs(subspace.complementFull(is2D));
        updateMesh();
        if (editor) editor.sync();
        updateComboLabel();
        updateCaption();
      }
      if (this.isLive) {
        this.draggable(view, { points: this.vectors, onDrag: onDrag, postDrag: afterVectorsChanged });
        // WCAG 2.1.1 / 2.5.1: number inputs for each draggable vector
        document.getElementById('vec-editor').hidden = false;
        editor = buildVectorEditor(document.getElementById('vec-inputs'),
          this.vectors.map(function(v, i) {
            return { name: self.labels[i], tex: texLabel(self.labels[i]), vec: v, dim: DIM };
          }), range, afterVectorsChanged);
      }

      // ── Caption TeX (shared builders from js/demo-ui.js) ──────────────────
      function texSet() {
        return '\\left\\{' + self.vectors.map(function(v, i) {
          return texVec(v, self.colors[i], DIM);
        }).join(',\\,') + '\\right\\}';
      }
      function texColsMatrix() { return texMat(self.vectors, { rows: DIM, colors: self.colors }); }
      function lhs() {
        return self.urlParams.capopt === 'matrix'
          ? texColsMatrix() + texVec(coeffVals())
          : texComb(self.vectors, coeffVals(), { colors: self.colors, dim: DIM });
      }
      function combine() {
        var cs = coeffVals(), out = [0, 0, 0];
        self.vectors.forEach(function(v, i) {
          for (var k = 0; k < 3; k++) out[k] += cs[i] * v[k];
        });
        return out;
      }

      // ── Captions (was this.caption + katex.render) ─────────────────────────
      var main  = document.getElementById('caption-main');
      var types = ["a point", "a line", "a plane", "space"];
      var eqnElt, vectorsElt, spanElt, complElt;
      switch (this.urlParams.captions) {
        case "target":
          main.innerHTML = '<p>Solve this equation by moving the sliders:</p>' +
                           '<p><span id="eqn-here" class="live-math"></span>.</p>';
          eqnElt = document.getElementById('eqn-here');
          var successBox = document.getElementById('success');
          var successElt = document.getElementById('success-here');
          updateCaption = function() {
            var lc = combine(), t = self.target;
            var str = lhs() + ' = ' + texVec(lc, null, DIM);
            // Tolerance avoids float noise from 0.1-step sliders
            var equal = Math.abs(lc[0] - t[0]) < 1e-6 &&
                        Math.abs(lc[1] - t[1]) < 1e-6 &&
                        Math.abs(lc[2] - t[2]) < 1e-6;
            renderMath(str + (equal ? ' = ' : ' \\neq ') + texVec(t, null, DIM), eqnElt);
            if (equal) { renderMath(str, successElt); successBox.hidden = false; }
            else       { successBox.hidden = true; }
          };
          break;
        case "combo":
          main.innerHTML = '<p><span id="eqn-here" class="live-math"></span></p>';
          eqnElt = document.getElementById('eqn-here');
          updateCaption = function() {
            renderMath(lhs() + ' = ' + texVec(combine(), null, DIM), eqnElt);
          };
          break;
        case "indep":
          main.innerHTML = '<p>The set <span id="vectors-here" class="live-math"></span>' +
                           '<span class="inter-is">is</span>' +
                           '<span id="span-type" class="span-type"></span>.</p>';
          vectorsElt = document.getElementById('vectors-here');
          spanElt    = document.getElementById('span-type');
          updateCaption = function() {
            renderMath(texSet(), vectorsElt);
            spanElt.textContent = subspace.dim === self.numVecs
              ? "linearly independent" : "linearly dependent";
          };
          break;
        case "orthog":
          var spanTex = '\\(\\operatorname{Span}\\{' + this.labels.map(texLabel).join(',') + '\\}\\)';
          main.innerHTML = '<p>The subspace ' + spanTex +
                           '<span class="inter-is">is</span>' +
                           '<span id="span-type" class="span-type"></span>.</p>' +
                           '<p>The orthogonal complement of ' + spanTex +
                           '<span class="inter-is">is</span>' +
                           '<span id="complement-type" class="span-type complement"></span>.</p>';
          typesetIn(main);
          spanElt  = document.getElementById('span-type');
          complElt = document.getElementById('complement-type');
          updateCaption = function() {
            spanElt.textContent  = types[subspace.dim];
            complElt.textContent = types[complement.dim];
          };
          break;
        default:
          main.innerHTML = '<p>' +
            (this.urlParams.capopt === 'matrix' ? 'The span of the columns of ' : 'Span ') +
            '<span id="vectors-here" class="live-math"></span>' +
            '<span class="inter-is">is</span>' +
            '<span id="span-type" class="span-type"></span>.</p>';
          vectorsElt = document.getElementById('vectors-here');
          spanElt    = document.getElementById('span-type');
          updateCaption = function() {
            renderMath(self.urlParams.capopt === 'matrix' ? texColsMatrix() : texSet(), vectorsElt);
            spanElt.textContent = types[subspace.dim];
          };
      }

      // ── Native controls (shared builders; replace dat.GUI) ─────────────────
      var controls    = document.getElementById('controls');
      var checkPanel  = document.getElementById('check-panel');
      var sliderPanel = document.getElementById('slider-panel');
      var anyControl  = false;
      if (this.urlParams.axes !== "disabled") {
        addCheckbox(checkPanel, { id: 'axes', label: 'Show axes', checked: params.Axes,
          onChange: function(v) { params.Axes = v; mathbox.select(".view-axes").set("visible", v); } });
        anyControl = true;
      }
      if (this.urlParams.lincombo !== "disabled") {
        var comboTex = this.coeffs.map(function(c, i) {
          return c + '\\,' + texLabel(self.labels[i]);
        }).join(' + ');
        addCheckbox(checkPanel, { id: 'lincombo', label: 'Show \\(' + comboTex + '\\)', checked: params.showCombo,
          onChange: function(v) { params.showCombo = v; mathbox.select(".lincombo").set("visible", v); } });
        this.coeffs.forEach(function(c) {
          buildSlider(sliderPanel, {
            name: c, tex: c, min: -10, max: 10, step: 0.1, value: params[c],
            onInput: function(v) { params[c] = v; updateComboLabel(); updateCaption(); }
          });
        });
        anyControl = true;
      }
      if (gridEnabled) {
        addCheckbox(checkPanel, { id: 'grid', label: 'Show grid', checked: params.Grid,
          onChange: function(v) {
            params.Grid = v;
            mathbox.select("#vecgrid").set("visible", v);
            clipCube.uniforms.hilite.value = !v;
          } });
        anyControl = true;
      }
      if (anyControl) {
        controls.hidden = false;
        controls.open = this.urlParams.closed == null;
      }
      return updateCaption();
    });
  }); // end DomReady.ready

  initFullscreenButton('fs-btn');
  </script>
</body>
</html>
