<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, maximum-scale=1">
  <title>A vector by coordinates</title>

  <!-- Shared MathJax config + helpers (renderMath, texColor, mathJaxReady). Plain script: no defer/async. -->
  <script src="js/mathjax-setup.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0; height: 100%;
      background: white; overflow: hidden;
      display: flex; flex-direction: column;
    }

    :root {
      --palette-violet: #7722bb;
    }

    .caption-bar {
      flex: 0 0 auto;
      padding: 5px 10px;
      background: white;
      border-bottom: 1px solid #ccc;
    }
    .caption-bar p      { margin: 2px 0; font-size: 0.9em; }
    .caption-bar p.hint { font-size: 0.8em; color: #555; }
    .live-math { display: inline-block; min-height: 1.4em; }

    details.panel { margin-top: 3px; font-size: 0.82em; }
    details.panel summary { cursor: pointer; color: #555; user-select: none; }

    /* Vector coordinate editor (keyboard alternative to dragging) */
    .vec-grid {
      display: flex; flex-wrap: wrap;
      gap: 2px 16px; margin-top: 3px;
    }
    .vec-row   { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
    .vec-label { min-width: 1.6em; text-align: right; }
    .vec-row input[type="number"] {
      width: 58px; padding: 1px 3px; font-size: 0.95em;
      border: 1px solid #bbb; border-radius: 2px;
    }

    /* Slider rows: label | slider | value */
    .slider-grid {
      display: grid;
      grid-template-columns: auto 1fr 3.5em;
      gap: 2px 6px; align-items: center; margin-top: 4px;
      font-size: 0.88em;
    }
    .slider-grid label { text-align: right; white-space: nowrap; }
    .slider-grid input[type="range"] { width: 100%; }
    .slider-val { text-align: right; font-variant-numeric: tabular-nums; }

    .check-row { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 0.88em; }

    #mathbox-container { flex: 1 1 auto; position: relative; overflow: hidden; }
    #mathbox1 { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    :focus-visible { outline: 2px solid #0066cc; outline-offset: 2px; }

    #fs-btn {
      float: right; cursor: pointer; background: none;
      border: 1px solid #aaa; border-radius: 3px;
      padding: 2px 6px; font-size: 0.85em; color: #444;
    }
    #fs-btn:hover { background: rgba(0,0,0,.07); }
    :fullscreen #fs-btn, :-webkit-full-screen #fs-btn { display: none; }
    /* MathJax labels over the canvas (js/demo-labels.js) */
    .label-layer  { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                    pointer-events: none; overflow: hidden; z-index: 1; }
    .canvas-label { position: absolute; left: 0; top: 0; font-size: 15px; white-space: nowrap;
                    text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 2px #fff; will-change: transform; }
  </style>
</head>
<body>

  <div class="caption-bar" role="region" aria-label="Vector by coordinates controls">
    <button id="fs-btn" title="Toggle fullscreen" aria-label="Toggle fullscreen">⛶</button>
    <p><span id="vectors-here" class="live-math" aria-live="polite" aria-atomic="true"></span></p>
    <p class="hint mathjax-static">Drag the arrow head and tail, or use the sliders and tail coordinates below.</p>
    <div id="slider-panel" class="slider-grid" role="group" aria-label="Slider controls"></div>
    <details class="panel">
      <summary>Edit tail position (keyboard alternative to dragging)</summary>
      <div id="vec-inputs" class="vec-grid" role="group" aria-label="Vector coordinates"></div>
    </details>
  </div>

  <!-- Canvas: draggable for pointer users; aria-hidden because the caption bar
       and controls expose the same state to assistive technology -->
  <div id="mathbox-container" aria-hidden="true">
    <div id="mathbox1"></div>
  </div>

  <!-- ILA demo bundle: external/iframes/js/demo.js -->
  <script src="js/demo.js"></script>
  <script src="js/demo-theme.js"></script>   <!-- book colour palette; must follow demo.js -->
  <script src="js/demo-labels.js"></script>  <!-- MathJax canvas labels -->

  <script>
  "use strict";

  // ── Local helpers (names do not clash with js/mathjax-setup.js) ──────────

  // Format a coordinate for TeX; avoids "-0.00".
  function fmt(x) {
    return (Math.abs(x) < 0.005 ? 0 : x).toFixed(2);
  }

  // Column vector as TeX, optionally coloured. Replaces demo.js texVector(),
  // whose colour output uses CSS strings that MathJax does not reliably accept.
  function texVec(v, color, dim) {
    dim = dim || v.length;
    var body = '\\begin{bmatrix}' +
      v.slice(0, dim).map(fmt).join('\\\\') +
      '\\end{bmatrix}';
    return color ? '\\color' + texColor(color) + '{' + body + '}' : body;
  }

  // Number-input editor for one or more vectors (WCAG 2.1.1 / 2.5.1 alternative
  // to dragging). Inputs write into the same arrays that draggable mutates.
  //   specs: [{ name: 'v', tex: 'v', vec: array, dim: 3 }, ...]
  //   onInput(specIndex, component) is called after a committed change.
  function buildVectorEditor(container, specs, range, onInput) {
    var entries = [];
    specs.forEach(function(spec, si) {
      var row = document.createElement('div');
      row.className = 'vec-row';
      var lab = document.createElement('span');
      lab.className = 'vec-label';
      lab.setAttribute('aria-hidden', 'true');
      lab.textContent = '\\(' + spec.tex + '\\) :';
      row.appendChild(lab);
      var inputs = [];
      for (var k = 0; k < spec.dim; k++) {
        (function(k) {
          var inp = document.createElement('input');
          inp.type  = 'number';
          inp.min   = -range;
          inp.max   =  range;
          inp.step  = '0.1';
          inp.value = +spec.vec[k].toFixed(2);
          inp.setAttribute('aria-label', spec.name + ' component ' + (k + 1));
          // WCAG 2.5.2: 'change' commits on Enter/blur, not every keystroke
          inp.addEventListener('change', function() {
            var x = parseFloat(inp.value);
            if (isFinite(x)) {
              spec.vec[k] = Math.max(-range, Math.min(range, x));
            }
            inp.value = +spec.vec[k].toFixed(2);
            onInput(si, k);
          });
          inputs.push(inp);
          row.appendChild(inp);
        })(k);
      }
      entries.push({ spec: spec, inputs: inputs });
      container.appendChild(row);
    });
    // Labels were created after load, so typeset them explicitly
    mathJaxReady.then(function() { return MathJax.typesetPromise([container]); });
    return {
      // Push current vector values back into the inputs (after a drag)
      sync: function() {
        entries.forEach(function(e) {
          e.inputs.forEach(function(inp, k) {
            if (document.activeElement !== inp) inp.value = +e.spec.vec[k].toFixed(2);
          });
        });
      }
    };
  }

  // Labelled range slider (replaces dat.GUI). Returns { input, set(value) }.
  function buildSlider(container, opts) {
    var id = 'slider-' + opts.name.replace(/\W/g, '_');
    var label = document.createElement('label');
    label.setAttribute('for', id);
    label.textContent = '\\(' + opts.tex + '\\) =';
    var input = document.createElement('input');
    input.type  = 'range';
    input.id    = id;
    input.min   = opts.min;
    input.max   = opts.max;
    input.step  = opts.step;
    input.value = opts.value;
    input.setAttribute('aria-label', opts.name + ' value');
    var val = document.createElement('span');
    val.className = 'slider-val';
    function show(v) {
      var s = (+v).toFixed(2);
      val.textContent = s;
      input.setAttribute('aria-valuetext', opts.name + ' equals ' + s);
    }
    show(opts.value);
    input.addEventListener('input', function() {
      var v = parseFloat(input.value);
      show(v);
      opts.onInput(v);
    });
    container.appendChild(label);
    container.appendChild(input);
    container.appendChild(val);
    return {
      input: input,
      set: function(v) { input.value = v; show(v); }
    };
  }

  DomReady.ready(function() {
    var RANGE     = 10;
    var vecColor  = new Color("green");
    var lineColor = new Color("blue");
    var origin    = [0, 0, 0];
    var vector    = [5, 3, 4];
    // Components of v (head minus tail): what the sliders control
    var params    = { a: vector[0], b: vector[1], c: vector[2] };
    var eqnElt    = document.getElementById('vectors-here');

    function headFromParams() {
      vector[0] = origin[0] + params.a;
      vector[1] = origin[1] + params.b;
      vector[2] = origin[2] + params.c;
    }
    function updateCaption() {
      renderMath('\\color' + texColor(vecColor) + '{v} = ' +
                 texVec([params.a, params.b, params.c], lineColor), eqnElt);
    }

    var sliderPanel = document.getElementById('slider-panel');
    var sliders = {};
    ['a', 'b', 'c'].forEach(function(name) {
      sliders[name] = buildSlider(sliderPanel, {
        name: name, tex: name, min: -RANGE, max: RANGE, step: 0.1, value: params[name],
        onInput: function(v) { params[name] = v; headFromParams(); updateCaption(); }
      });
    });
    mathJaxReady.then(function() { return MathJax.typesetPromise([sliderPanel]); });

    // Keyboard alternative for dragging the tail; head follows (same as drag)
    var editor = buildVectorEditor(document.getElementById('vec-inputs'), [
      { name: 'tail', tex: '\\text{tail}', vec: origin, dim: 3 }
    ], RANGE, function() { headFromParams(); updateCaption(); });

    function syncFromDrag() {
      ['a', 'b', 'c'].forEach(function(name) { sliders[name].set(params[name]); });
      editor.sync();
      updateCaption();
    }

    updateCaption();

    new Demo({
      // demo.js binds a bare 'f' key to fullscreen (WCAG 2.1.4); turn it off
      fullscreen: false,
      mathbox: {
        element: document.getElementById('mathbox1'),
        mathbox: { warmup: 10, splash: false, inspect: false }
      },
      camera: { position: [3, -1, 1.5] }
    }, function() {
      window.mathbox = this.mathbox;
      var view = this.view({ axes: true });
      // No `labels` option: WebGL text replaced by MathJax labels below
      this.labeledVectors(view, {
        vectors: [vector],
        origins: [origin],
        colors:  [new Color("green")]
      });
      var labelLayer = makeLabelLayer(document.getElementById('mathbox1'), this, view);
      addVectorLabels(labelLayer, [vector], [vecColor], ['v'], [origin]);
      // Coordinate path tail → x → y → z (head)
      view.array({
        channels: 3,
        width: 4,
        expr: function(emit, i) {
          switch (i) {
            case 0: return emit.apply(null, origin);
            case 1: return emit(vector[0], origin[1], origin[2]);
            case 2: return emit(vector[0], vector[1], origin[2]);
            case 3: return emit.apply(null, vector);
          }
        }
      }).line({
        classes: ["linear-combo"],
        color: lineColor.arr(),
        opacity: 0.75,
        width: 4,
        zIndex: 1
      });

      // Component labels (x, y, z steps of the coordinate path) as MathJax;
      // replaces the WebGL .text().label() with black background.
      var compAnchors = [
        function() { return [(origin[0] + vector[0]) / 2, origin[1], origin[2]]; },
        function() { return [vector[0], (origin[1] + vector[1]) / 2, origin[2]]; },
        function() { return [vector[0], vector[1], (origin[2] + vector[2]) / 2]; }
      ];
      var compLabels = compAnchors.map(function(fn) {
        return labelLayer.add({ position: fn, offset: [25, 0] });
      });
      var lastComp = ['', '', ''];
      (function refreshComps() {
        for (var i = 0; i < 3; i++) {
          var tex = texColored(lineColor, fmt(vector[i] - origin[i]));
          if (tex !== lastComp[i]) { lastComp[i] = tex; compLabels[i].set(tex); }
        }
        requestAnimationFrame(refreshComps);
      })();

      this.draggable(view, {
        points: [origin, vector],
        size: 30,
        hiliteColor: [0, 1, 1, .75],
        onDrag: function(vec) {
          if (this.dragging === 0) {
            // Dragging the tail: head moves with it, components unchanged
            vector[0] = vec.x + params.a;
            vector[1] = vec.y + params.b;
            vector[2] = vec.z + params.c;
          } else {
            vec.clampScalar(-RANGE, RANGE);
            params.a = vec.x - origin[0];
            params.b = vec.y - origin[1];
            params.c = vec.z - origin[2];
          }
        },
        postDrag: syncFromDrag
      });
    });
  }); // end DomReady.ready

  // ── Fullscreen toggle (works standalone; may be blocked when embedded) ───
  (function() {
    var btn = document.getElementById('fs-btn');
    function isFS() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }
    function updateLabel() {
      var label = isFS() ? 'Exit fullscreen' : 'Toggle fullscreen';
      btn.textContent = isFS() ? '✕' : '⛶';
      btn.title = label;
      btn.setAttribute('aria-label', label);
    }
    btn.addEventListener('click', function() {
      var el = document.documentElement, p;
      if (!isFS()) {
        var req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req) p = req.call(el);
      } else {
        var exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) p = exit.call(document);
      }
      if (p && p.catch) p.catch(function() {});
    });
    ['fullscreenchange', 'webkitfullscreenchange']
      .forEach(function(e) { document.addEventListener(e, updateLabel); });
  })();
  </script>
</body>
</html>
