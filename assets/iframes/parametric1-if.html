<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, maximum-scale=1">
  <title>Parametric Form</title>

  <!-- Shared MathJax config + helpers (renderMath, texColor). Plain script: no defer/async. -->
  <script src="js/mathjax-setup.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    /* ── Flex column: caption bar above canvas ──────────────────────────── */
    html, body {
      margin:     0;
      height:     100%;
      background: white;
      overflow:   hidden;
      display:    flex;
      flex-direction: column;
    }

    /* ── Caption / control bar ──────────────────────────────────────────── */
    .caption-bar {
      flex:          0 0 auto;
      padding:       5px 10px;
      background:    white;
      border-bottom: 1px solid #ccc;
      z-index:       2;
    }
    .caption-bar p {
      margin: 2px 0;
      font-size: 0.9em;
    }

    /* ── Slider row ─────────────────────────────────────────────────────── */
    .slider-row {
      display:     flex;
      align-items: center;
      gap:         8px;
      margin-top:  4px;
      font-size:   0.88em;
    }
    .slider-row label { white-space: nowrap; }
    .slider-row input[type="range"] { flex: 1; }
    .slider-row .z-val {
      min-width:   3.2em;
      text-align:  right;
      font-variant-numeric: tabular-nums;
    }

    /* ── Canvas container ────────────────────────────────────────────────── */
    #mathbox-container {
      flex:     1 1 auto;
      position: relative;
      overflow: hidden;
    }
    #mathbox1 {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    /* ── WCAG 2.4.7 Focus visible ─────────────────────────────────────────*/
    :focus-visible {
      outline:        2px solid #0066cc;
      outline-offset: 2px;
    }

    /* ── Fullscreen button ───────────────────────────────────────────────── */
    #fs-btn {
      float:         right;
      cursor:        pointer;
      background:    none;
      border:        1px solid #aaa;
      border-radius: 3px;
      padding:       2px 6px;
      font-size:     0.85em;
      line-height:   1.2;
      color:         #444;
    }
    #fs-btn:hover { background: rgba(0,0,0,.07); }
    :fullscreen          #fs-btn,
    :-webkit-full-screen #fs-btn { display: none; }
  </style>
</head>
<body>

  <!-- Caption bar: equations + slider -->
  <div class="caption-bar" role="region" aria-label="Parametric form interactive controls">

    <button id="fs-btn" title="Toggle fullscreen" aria-label="Toggle fullscreen">⛶</button>

    <!-- Static equations (rendered once by MathJax) -->
    <p>
      <span id="eqn1-here"></span>
    </p><p>
      <span id="eqn2-here"></span>
    </p>

    <!-- Live vector equation (re-rendered on every slider change) -->
    <!-- WCAG 4.1.3 / best practice: aria-live so screen readers announce updates -->
    <p>
      <span id="vec-here" aria-live="polite" aria-atomic="true"></span>
    </p>

    <!--
      WCAG 2.1.1 Keyboard: <input type="range"> is natively keyboard-operable.
      Arrow keys move the slider; no path-based gesture needed (WCAG 2.5.1).
      This replaces the dat.GUI slider which has no accessible label.
    -->
    <div class="slider-row mathjax-static">
      <label for="z-slider">
        \(z\) =
      </label>
      <input id="z-slider"
             type="range"
             min="-1.8"
             max="2.2"
             step="0.1"
             value="0"
             aria-label="z parameter value"
             aria-valuemin="-1.8"
             aria-valuemax="2.2"/>
      <span class="z-val" id="z-display" aria-live="off">0.00</span>
    </div>
  </div>

  <!-- Canvas: aria-hidden because all information is in the caption bar above -->
  <div id="mathbox-container" aria-hidden="true">
    <div id="mathbox1"></div>
  </div>

  <!--
    Place the ILA demo bundle at:
      external/iframes/js/demo.js
    (relative to this file's location in external/iframes/)
  -->
  <script src="js/demo.js"></script>

  <script>
  "use strict";

  DomReady.ready(function() {

    var lineColor   = new Color("yellow");
    var plane1Color = new Color("violet");
    var plane2Color = new Color("green");
    var pointColor  = new Color("red");

    // Current z value (shared with MathBox live expr via closure)
    var params = { z: 0.0 };

    var vecElt    = document.getElementById('vec-here');
    var zDisplay  = document.getElementById('z-display');
    var zSlider   = document.getElementById('z-slider');

    // ── Update MathJax caption and z readout ──────────────────────────────
    function updateCaption() {
      var x = (1  - 5 * params.z).toFixed(2);
      var y = (-1 - 2 * params.z).toFixed(2);
      var z = params.z.toFixed(2);
      var str = '(x, y, z) = (1-5z,\\, {-1}-2z,\\, z) = \\color' + texColor(pointColor) + '{';
      str += '({' + x + '},\\, {' + y + '},\\, {' + z + '})}';
      renderMath(str, vecElt);
      zDisplay.textContent = z;
      // Keep aria-valuenow in sync for screen readers
      zSlider.setAttribute('aria-valuenow', z);
      zSlider.setAttribute('aria-valuetext', 'z equals ' + z);
    }

    // ── WCAG 2.5.2 Pointer Cancellation: use 'input' for range (standard) ─
    // Range inputs fire 'input' on every position change (mouse or keyboard)
    // and 'change' on final commit. Using 'input' gives live feedback, which
    // is the expected behavior for a slider and is acceptable for WCAG 2.5.2
    // (the user can release / press Escape to abandon a keyboard change).
    zSlider.addEventListener('input', function() {
      params.z = parseFloat(this.value);
      updateCaption();
    });

    // ── MathBox 3-D scene ─────────────────────────────────────────────────
    new Demo({
      mathbox: { element: document.getElementById('mathbox1') },
      scaleUI: true,
      camera:  { position: [1.5, 3, 1.5] }
    }, function() {
      var clipCube, subspace1, subspace2, subspace3, view;
      window.mathbox = this.mathbox;

      view = this.view({
        viewRange: [[-10, 10], [-10, 10], [-3, 3]]
      });

      clipCube = this.clipCube(view, { draw: true });

      // Plane 1: 2x + y + 12z = 1
      // Null space vectors: [-1/2, 1, 0] and [-6, 0, 1]
      subspace1 = this.subspace({
        vectors: [[-1/2, 1, 0], [-6, 0, 1]],
        color:   plane1Color,
        live:    false,
        name:    "plane1"
      });
      subspace1.draw(clipCube.clipped.transform({ position: [1/2, 0, 0] }));

      // Plane 2: x + 2y + 9z = -1
      // Null space vectors: [-2, 1, 0] and [-9, 0, 1]
      subspace2 = this.subspace({
        vectors: [[-2, 1, 0], [-9, 0, 1]],
        color:   plane2Color,
        live:    false,
        name:    "plane2"
      });
      subspace2.draw(clipCube.clipped.transform({ position: [-1, 0, 0] }));

      // Intersection line: direction [-5, -2, 1], passing through (1,-1,0)
      subspace3 = this.subspace({
        vectors:  [[-5, -2, 1]],
        color:    lineColor,
        lineOpts: { opacity: 1.0, width: 4, zIndex: 3 },
        name:     "line",
        live:     false
      });
      subspace3.draw(clipCube.clipped.transform({ position: [1, -1, 0] }));

      // Moving red point — live expr re-evaluated each frame, reads params.z
      view.array({
        channels: 3,
        width:    1,
        expr: function(emit) {
          return emit(1 - 5 * params.z, -1 - 2 * params.z, params.z);
        }
      }).point({
        color:  pointColor.arr(),
        size:   15,
        zIndex: 3,
        zTest:  false
      }).format({
        expr: function(x, y, z) {
          return '(' + x.toPrecision(2) + ', ' + y.toPrecision(2) + ', ' + z.toPrecision(2) + ')';
        }
      }).label({
        outline: 0,
        color:   pointColor.arr(),
        offset:  [0, 20],
        size:    13,
        zIndex:  3
      });

      // Render static plane equations once
      renderMath(
        '\\color' + texColor(plane1Color) + '{2x + \\phantom{2}y + 12z = 1}',
        document.getElementById('eqn1-here')
      );
      renderMath(
        '\\color' + texColor(plane2Color) + '{\\phantom{2}x + 2y + \\phantom{1}9z = -1}',
        document.getElementById('eqn2-here')
      );

      // Render initial live caption
      updateCaption();
    });

  }); // end DomReady.ready

  // ── Fullscreen toggle (WCAG 2.1.1 — button, keyboard-operable) ──────────
  (function() {
    var btn = document.getElementById('fs-btn');

    function isFullscreen() {
      return !!(document.fullscreenElement       ||
                document.webkitFullscreenElement ||
                document.mozFullScreenElement    ||
                document.msFullscreenElement);
    }

    function updateLabel() {
      btn.textContent = isFullscreen() ? '✕' : '⛶';
      btn.title       = isFullscreen() ? 'Exit fullscreen' : 'Toggle fullscreen';
      btn.setAttribute('aria-label', btn.title);
    }

    btn.addEventListener('click', function() {
      if (!isFullscreen()) {
        var el = document.documentElement;
        if      (el.requestFullscreen)       el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else if (el.mozRequestFullScreen)    el.mozRequestFullScreen();
        else if (el.msRequestFullscreen)     el.msRequestFullscreen();
      } else {
        if      (document.exitFullscreen)       document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.mozCancelFullScreen)  document.mozCancelFullScreen();
        else if (document.msExitFullscreen)     document.msExitFullscreen();
      }
    });

    ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange']
      .forEach(function(evt) { document.addEventListener(evt, updateLabel); });
  })();
  </script>
</body>
</html>
