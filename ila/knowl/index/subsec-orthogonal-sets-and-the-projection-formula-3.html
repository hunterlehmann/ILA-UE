</h2>
<div class="para">A set of <em class="emphasis">nonzero</em> vectors <span class="process-math">\(\{u_1,u_2,\ldots,u_m\}\)</span> is called <dfn class="terminology">orthogonal</dfn> if <span class="process-math">\(u_i\cdot u_j = 0\)</span> whenever <span class="process-math">\(i\neq j\text{.}\)</span>  It is <dfn class="terminology">orthonormal</dfn> if it is orthogonal, and in addition <span class="process-math">\(u_i\cdot u_i = 1\)</span> for all <span class="process-math">\(i=1,2,\ldots,m\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#subsec-orthogonal-sets-and-the-projection-formula-3-5-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
