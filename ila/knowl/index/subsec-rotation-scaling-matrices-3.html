<div class="para logical">
<div class="para">A <dfn class="terminology">rotation-scaling matrix</dfn> is a <span class="process-math">\(2\times 2\)</span> matrix of the form</div>
<div class="displaymath process-math">
\begin{align*}
\begin{pmatrix}
a \amp -b \\
b \amp a
\end{pmatrix}\text{,}
\end{align*}
</div>
<div class="para">where <span class="process-math">\(a\)</span> and <span class="process-math">\(b\)</span> are real numbers, not both equal to zero.</div>
