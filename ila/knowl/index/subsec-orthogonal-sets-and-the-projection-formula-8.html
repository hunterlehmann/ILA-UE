<div class="para logical">
<div class="para">If <span class="process-math">\(\{v_1,v_2,\ldots,v_m\}\)</span> is an orthogonal set of vectors, then</div>
<div class="displaymath process-math">
\begin{gather*}
\left\{\frac{v_1}{\|v_1\|},\;\frac{v_2}{\|v_2\|},\ldots,\;\frac{v_m}{\|v_m\|}\right\}
\end{gather*}
</div>
<div class="para">is an orthonormal set.</div>
