</h2>
<div class="para logical">
<div class="para">A <dfn class="terminology">linear transformation</dfn> is a transformation <span class="process-math">\(T\colon\R^n\to\R^m\)</span> satisfying</div>
<div class="displaymath process-math">
\begin{align*}
T(u + v) \amp= T(u) + T(v)\\
T(cu) \amp= cT(u)
\end{align*}
</div>
<div class="para">for all vectors <span class="process-math">\(u,v\)</span> in <span class="process-math">\(\R^n\)</span> and all scalars <span class="process-math">\(c\text{.}\)</span>
</div>
