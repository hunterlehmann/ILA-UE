<div class="para">Let <span class="process-math">\(W\)</span> be a subspace of <span class="process-math">\(\R^n\)</span> with basis <span class="process-math">\(v_1,v_2,\ldots,v_m\text{,}\)</span> and let <span class="process-math">\(A\)</span> be the matrix with columns <span class="process-math">\(v_1,v_2,\ldots,v_m\text{.}\)</span>  Then the standard matrix for <span class="process-math">\(T(x) = x_W\)</span> is</div>

\begin{gather*}
A(A^TA)\inv A^T\text{.}
\end{gather*}
