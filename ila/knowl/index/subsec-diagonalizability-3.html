<span class="type">Definition</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">5.4.1</span><span class="period heading-divison-mark heading-divison-mark__period">.</span>
</h2>
<div class="para logical">
<div class="para">An <span class="process-math">\(n\times n\)</span> matrix <span class="process-math">\(A\)</span> is <dfn class="terminology">diagonalizable</dfn> if it is similar to a diagonal matrix: that is, if there exists an invertible <span class="process-math">\(n\times n\)</span> matrix <span class="process-math">\(C\)</span> and a diagonal matrix <span class="process-math">\(D\)</span> such that</div>
<div class="displaymath process-math">
\begin{gather*}
A = CDC\inv\text{.}
\end{gather*}
</div>
