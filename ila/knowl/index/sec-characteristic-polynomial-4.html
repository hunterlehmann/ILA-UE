<div class="para logical">
<div class="para">Let <span class="process-math">\(A\)</span> be an <span class="process-math">\(n\times n\)</span> matrix.  The <dfn class="terminology">characteristic polynomial</dfn> of <span class="process-math">\(A\)</span> is the function <span class="process-math">\(f(\lambda)\)</span> given by</div>
<div class="displaymath process-math">
\begin{gather*}
f(\lambda) = \det(A-\lambda I_n)\text{.}
\end{gather*}
</div>
